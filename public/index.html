<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini 워터마크 제거</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310B981' stroke-width='2'%3E%3Cpath d='M12 3l-1.9 5.8-5.8 1.9 5.8 1.9 1.9 5.8 1.9-5.8 5.8-1.9-5.8-1.9z'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#10B981',
            'primary-hover': '#059669',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    body.loading { opacity: 0; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #10B981; border-radius: 4px; }
    .medium-zoom-overlay, .medium-zoom-image--opened { z-index: 999; }
    .medium-zoom-overlay { backdrop-filter: blur(4px); }
    .checker-bg {
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgZmlsbD0iI2Y5ZmRmZCI+PHJlY3Qgd2lkdGg9IjEwIiBoZWlnaHQ9IjEwIiBmaWxsPSIjZjJmMmYyIi8+PHJlY3QgeD0iMTAiIHk9IjEwIiB3aWR0aD0iMTAiIGhlaWdodD0iMTAiIGZpbGw9IiNmMmYyZjIiLz48L3N2Zz4=');
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-100 min-h-screen loading">

  <!-- 헤더 -->
  <header class="sticky top-0 z-50 bg-white/90 dark:bg-gray-900/90 backdrop-blur border-b border-gray-100 dark:border-gray-800">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <svg class="h-6 w-6 text-primary" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m12 3-1.9 5.8-5.8 1.9 5.8 1.9 1.9 5.8 1.9-5.8 5.8-1.9-5.8-1.9Z"></path>
        </svg>
        <span class="font-semibold text-gray-800 dark:text-gray-100">Gemini 워터마크 제거</span>
      </div>
      <button id="themeToggle" class="p-2 text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 rounded-lg transition-colors">
        <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-6">

    <!-- 업로드 영역 -->
    <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-700 overflow-hidden">
      <!-- 파일 드래그앤드랍 -->
      <div id="uploadArea" class="group flex flex-col items-center justify-center h-44 cursor-pointer border-2 border-dashed border-gray-200 dark:border-gray-700 hover:border-primary dark:hover:border-primary rounded-xl m-3 transition-all hover:bg-emerald-50/40 dark:hover:bg-emerald-900/10">
        <svg class="w-9 h-9 text-gray-300 dark:text-gray-600 group-hover:text-primary mb-2.5 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <p class="text-sm font-medium text-gray-500 dark:text-gray-400 group-hover:text-primary transition-colors">클릭하거나 이미지를 드래그하세요</p>
        <p class="text-xs text-gray-400 dark:text-gray-600 mt-1">JPG · PNG · WebP</p>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple class="hidden" />
      </div>

      <!-- 구분선 -->
      <div class="flex items-center gap-3 px-4 pb-1">
        <div class="flex-1 h-px bg-gray-100 dark:bg-gray-800"></div>
        <span class="text-xs text-gray-400 dark:text-gray-600 font-medium">또는</span>
        <div class="flex-1 h-px bg-gray-100 dark:bg-gray-800"></div>
      </div>

      <!-- URL 입력 -->
      <div class="px-3 pb-3 pt-2">
        <div class="flex gap-2">
          <div class="relative flex-1">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 dark:text-gray-500 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
            </svg>
            <input
              id="urlInput"
              type="url"
              placeholder="이미지 주소(URL)를 붙여넣으세요"
              class="w-full pl-9 pr-3 py-2.5 text-sm bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-gray-700 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-600 focus:outline-none focus:border-primary dark:focus:border-primary focus:bg-white dark:focus:bg-gray-750 transition-colors"
            />
          </div>
          <button
            id="urlSubmitBtn"
            class="px-4 py-2.5 bg-primary hover:bg-primary-hover text-white text-sm font-medium rounded-xl transition-colors flex items-center gap-1.5 flex-shrink-0"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
            불러오기
          </button>
        </div>
        <p id="urlError" class="mt-1.5 text-xs text-red-500 hidden"></p>
      </div>
    </div>

    <!-- 단일 이미지 미리보기 -->
    <section id="singlePreview" style="display:none;" class="space-y-4">

      <!-- 비포어/애프터 슬라이더 -->
      <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-700 overflow-hidden">
        <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-800 flex items-center justify-between">
          <span class="text-sm font-medium text-gray-600 dark:text-gray-400">비포어 / 애프터</span>
          <div class="flex gap-3">
            <span id="originalInfo" class="text-xs text-gray-400 dark:text-gray-500 font-mono"></span>
            <span id="processedInfo" class="text-xs text-emerald-500 font-mono" style="display:none;"></span>
          </div>
        </div>
        <div class="checker-bg select-none group">
          <div id="comparisonContainer" class="relative mx-auto w-fit max-w-full" style="max-height:70vh;">
            <img id="originalImage" class="block w-auto h-auto max-w-full max-h-[70vh] object-contain" draggable="false" />
            <div id="processedOverlay" class="absolute top-0 left-0 h-full w-[50%] overflow-hidden border-r-2 border-white/80 shadow-lg box-content z-10" style="display:none;">
              <img id="processedImage" class="block h-full max-w-none object-contain" draggable="false" />
            </div>
            <div id="sliderHandle" class="absolute top-0 bottom-0 w-10 -ml-5 z-20 cursor-col-resize flex items-center justify-center" style="left:50%; display:none;">
              <div class="w-0.5 h-full bg-white/60"></div>
              <div class="absolute w-8 h-8 bg-white rounded-full shadow-lg flex items-center justify-center border border-gray-200">
                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l-3 3 3 3m8-6l3 3-3 3"/></svg>
              </div>
            </div>
            <div class="absolute top-3 left-3 bg-black/50 text-white text-xs px-2 py-1 rounded-full backdrop-blur-sm pointer-events-none z-30">처리 후</div>
            <div class="absolute top-3 right-3 bg-black/50 text-white text-xs px-2 py-1 rounded-full backdrop-blur-sm pointer-events-none z-30">원본</div>
          </div>
        </div>
      </div>

      <!-- 다운로드 버튼 영역 -->
      <div id="downloadSection" class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-700 p-4 hidden">
        <div class="flex items-center justify-between mb-3">
          <span class="text-sm font-medium text-gray-600 dark:text-gray-400">다운로드</span>
          <button id="resetBtn" class="text-xs text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            다시 선택
          </button>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <button id="downloadBtn100" class="download-quality-btn py-3 bg-gray-900 dark:bg-emerald-600 hover:bg-black dark:hover:bg-emerald-700 text-white rounded-xl text-sm font-medium transition-all flex flex-col items-center gap-0.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            <span>100%</span>
            <span class="text-xs opacity-60 font-normal">원본 크기</span>
          </button>
          <button data-quality="50" class="quality-btn py-3 bg-gray-100 dark:bg-gray-800 hover:bg-emerald-50 dark:hover:bg-gray-700 hover:text-emerald-700 dark:hover:text-emerald-400 text-gray-600 dark:text-gray-300 rounded-xl text-sm font-medium transition-all flex flex-col items-center gap-0.5 border border-gray-200 dark:border-gray-700 hover:border-emerald-300">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            <span>50%</span>
            <span class="text-xs opacity-60 font-normal">절반 크기</span>
          </button>
          <button data-quality="25" class="quality-btn py-3 bg-gray-100 dark:bg-gray-800 hover:bg-emerald-50 dark:hover:bg-gray-700 hover:text-emerald-700 dark:hover:text-emerald-400 text-gray-600 dark:text-gray-300 rounded-xl text-sm font-medium transition-all flex flex-col items-center gap-0.5 border border-gray-200 dark:border-gray-700 hover:border-emerald-300">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            <span>25%</span>
            <span class="text-xs opacity-60 font-normal">최소 크기</span>
          </button>
        </div>
        <div id="statusMessage" class="mt-3 text-xs text-gray-400 dark:text-gray-500 min-h-[1rem] text-center"></div>
      </div>

    </section>

    <!-- 다중 이미지 미리보기 -->
    <section id="multiPreview" style="display:none;" class="space-y-4">
      <div class="flex items-center justify-between">
        <span id="progressText" class="text-sm font-medium text-gray-600 dark:text-gray-400"></span>
        <div class="flex items-center gap-2">
          <button id="multiResetBtn" class="text-xs text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            다시 선택
          </button>
          <button id="downloadAllBtn" class="py-2 px-4 bg-gray-900 dark:bg-emerald-600 hover:bg-black dark:hover:bg-emerald-700 text-white rounded-lg text-sm font-medium transition-all flex items-center gap-1.5" style="display:none;">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            전체 다운로드
          </button>
        </div>
      </div>
      <div id="imageList" class="space-y-3"></div>
    </section>

  </main>

  <!-- 로딩 오버레이 -->
  <div id="loadingOverlay" class="fixed inset-0 bg-white/80 dark:bg-gray-950/80 backdrop-blur-sm z-[60] hidden flex items-center justify-center">
    <div class="flex flex-col items-center gap-3">
      <div class="animate-spin rounded-full h-10 w-10 border-2 border-gray-200 border-t-primary"></div>
      <p class="text-sm text-gray-500 dark:text-gray-400">처리 중...</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
